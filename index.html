<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SSOT K-1 - Pengendalian Belanja</title>
<style>
body{margin:0;padding:14px;font:14px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;background:#f2f4f7;color:#1a1c1e}
h2{margin:0 0 2px;font-size:17px}.sub{color:#5f6368;font-size:12px;margin-bottom:10px}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sum div{flex:1 1 90px;background:#fff;border-radius:10px;padding:8px 10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sum b{display:block;font-size:20px}.sum span{font-size:11px;color:#5f6368}
.card{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.nm{font-weight:600;font-size:13.5px}.meta{font-size:12px;color:#3c4043;margin-top:4px}
.meta b{font-weight:600}
.b{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600;color:#fff;margin-left:6px;vertical-align:middle}
.g{background:#2E7D32}.y{background:#F9A825;color:#333}.r{background:#C62828}
.chain{display:flex;gap:4px;margin-top:8px}
.st{flex:1;text-align:center;font-size:9.5px;color:#5f6368}
.st i{display:block;height:7px;border-radius:4px;background:#e0e0e0;margin-bottom:3px}
.st.on i{background:#2E7D32}.st.kri i{background:#C62828}
.warn{margin-top:6px;font-size:11.5px;color:#C62828;font-weight:600}
footer{font-size:11px;color:#5f6368;margin-top:10px}
</style></head><body>
<h2>Pengendalian Belanja K-1</h2>
<div class="sub">SSOT K-1 KEPULAUAN - MONITORING_BELANJA - <span id="stamp"></span></div>
<div class="sum" id="sum"></div><div id="list"></div>
<footer>Data berubah di sheet SSOT -> diperbarui ke halaman ini oleh sistem (level menit). Token pada tautan diperlukan.</footer>
<script>
var QS=new URLSearchParams(location.search),TOK=QS.get("tok");
var TOKEN_BENAR="k1-ssot-2026-9f4c2a71";
function tolak(){document.body.innerHTML='<div style="font-family:sans-serif;padding:24px">Akses ditolak: tautan tidak lengkap.</div>';}
if(TOK!==TOKEN_BENAR){tolak();}
function fD(v){if(!v)return"";var d=new Date(v);if(isNaN(d))return String(v).replace("T"," ").slice(0,10);return d.getDate()+" "+["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"][d.getMonth()]}
function fmtRp(n){n=Number(n)||0;return"Rp"+n.toLocaleString("id-ID")}
function hk(ttd,n){var d=new Date(ttd),c=0;while(c<n){d.setDate(d.getDate()+1);var w=d.getDay();if(w!==0&&w!==6)c++}return d}
var st=["SP ttd","NRK/KPPN","Tiba","BAPP/BAST","SPP","SPM","SP2D"];
function render(D){
document.getElementById("stamp").textContent="data per "+D.updated;
var ROWS=D.rows,sp=0,kr=0;
var L=document.getElementById("list"),S=document.getElementById("sum");
ROWS.forEach(function(r){
var it=String(r["Item"]||""),nm=it.replace(/\*+/g,"");
if(!nm)return;
var stt=String(r["Status Inaproc"]||"");if(stt==="Sudah Pesan")sp++;
var ls=String(r["Mekanisme Bayar"]||"").indexOf("LS")>=0;
var nrk=String(r["NRK Daftar KPPN"]||"").trim();var nrkOk=nrk&&!/up bendahara/i.test(nrk);
var ttd=r["Tgl TTD SP"],tiba=r["Tgl Pesanan Tiba (Pemeriksaan Tim)"],ba=r["Tgl BAPP/BAST"],sp2d=r["SP2D"];
var vals=[ttd,(ls?nrk:(nrkOk?nrk:"UP-VA")),tiba,ba,r["SPP"],r["SPM"],sp2d];
var warn="";if(stt==="Sudah Pesan"&&ls&&!nrkOk&&ttd){var d=hk(ttd,5);
warn="NRK jalur LS belum tercatat - batas 5 HK: "+fD(d.toISOString())+" (PER-9)"}
if(warn)kr++;
var chain=st.map(function(s,i){var on=vals[i]&&String(vals[i]).trim()!=="";
return '<div class="st'+(on?" on":"")+(i===1&&!nrkOk&&ls?" kri":"")+'"><i></i>'+s+"</div>"}).join("");
var cls=stt==="Sudah Pesan"?"g":(stt&&stt!=="Belum Pesan"?"y":"r");
var link=r["Link Katalog/Pesanan Inaproc"];
var spn=String(r["No. SP"]||"");
var c=document.createElement("div");c.className="card";
c.innerHTML='<div class="nm">'+nm+'<span class="b '+cls+'">'+stt+"</span></div>"+
'<div class="meta">Nilai: <b>'+fmtRp(r["Nilai Nego (Rp)"])+"</b> - "+(r["Mekanisme Bayar"]||"")+((link&&String(link).indexOf("http")===0)?' - <a href="'+link+'">pesanan</a>':"")+"</div>"+
'<div class="meta">TTD SP: <b>'+fD(ttd)+"</b>"+(nrk?" - NRK: "+(nrkOk?nrk:"jalur UP-VA"):"")+(spn?" - SP: "+spn.slice(0,14)+"...":"")+"</div>"+
'<div class="chain">'+chain+"</div>"+(warn?'<div class="warn">'+warn+"</div>":"");
L.appendChild(c);});
S.innerHTML='<div><b>'+sp+"/"+ROWS.length+"</b><span>Sudah Pesan</span></div>"+
'<div><b>'+kr+"</b><span>Titik kritis</span></div>"+
'<div><b>'+fD(new Date().toISOString())+"</b><span>WITA saat dibuka</span></div>";}
fetch("data.json").then(function(r){return r.json()}).then(render).catch(function(e){
document.getElementById("list").innerHTML="Gagal memuat data: "+e;});
</script></body></html>
